name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack
      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/BumBoo-Agent-Controller-Windows-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BumBoo-Agent-Controller-Windows-Portable
          path: release/BumBoo-Agent-Controller-Windows-Portable.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BumBoo-Agent-Controller-Windows-Portable.zip
          generate_release_notes: true
